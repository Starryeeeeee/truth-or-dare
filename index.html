<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHEERS 奇思科创社 · 全社大会游戏环节</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="./subset/result.css">
<style>
/* ==================== 进入遮罩 ==================== */
#enterOverlay{
  position:fixed;inset:0;z-index:9999;
  background:radial-gradient(circle at 50% 40%, #FFFDF8 0%, #FBF7F0 55%, #F3EBDC 100%);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:opacity 1s ease;
}
#enterOverlay.hidden{opacity:0;pointer-events:none}
.enter-inner{
  display:flex;flex-direction:column;align-items:center;
  gap:150px;transform:translateY(-40px);
  animation:enterFadeIn 1.2s ease .3s both;
}
@keyframes enterFadeIn{
  from{opacity:0;transform:translateY(-30px)}
  to{opacity:1;transform:translateY(-40px)}
}
.enter-hint{display:flex;align-items:center;gap:18px}
.enter-pulse{
  width:16px;height:16px;border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 20px rgba(232,178,78,.9);
  animation:enterPulse 1.8s ease-in-out infinite;
  flex-shrink:0;
}
@keyframes enterPulse{
  0%,100%{transform:scale(1);opacity:.55;box-shadow:0 0 14px rgba(232,178,78,.7)}
  50%{transform:scale(1.5);opacity:1;box-shadow:0 0 40px rgba(232,178,78,1),0 0 70px rgba(232,131,74,.55)}
}
.enter-text{
  font-family:Georgia,"Times New Roman",serif;font-style:italic;
  font-size:26px;letter-spacing:.14em;color:var(--ink-soft);
  text-shadow:0 1px 0 rgba(255,255,255,.6);line-height:1;
}

/* ==================== Google 彩色加载动画 ==================== */
.loading-pm{display:flex;justify-content:center;align-items:center;}
.loading-pm .loading-wide{
  width:180px;height:180px;
  display:flex;justify-content:center;align-items:center;
  position:relative;transform:scale(1.15);
}
.loading-pm .color{background-color:#4285f4;}
.loading-pm .l1{
  width:15px;height:65px;position:absolute;
  animation:move-h 1.2s infinite cubic-bezier(0.65,0.05,0.36,1);
  background-color:#f4b400;
}
.loading-pm .l2{
  width:15px;height:60px;position:absolute;
  transform:rotate(90deg);
  animation:move-v 1.2s infinite cubic-bezier(0.65,0.05,0.36,1);
  background-color:#db4437;
}
@keyframes move-h{
  0%{top:0;opacity:0}25%{opacity:1}50%{top:30%;opacity:1}75%{opacity:1}100%{top:100%;opacity:0}
}
@keyframes move-v{
  0%{left:0;opacity:0}25%{opacity:1}50%{left:45%;opacity:1}75%{opacity:1}100%{left:100%;opacity:0}
}
.loading-pm .animation-effect-light{animation:effect .2s .1s infinite linear}
.loading-pm .animation-effect-light-d{animation:effect .3s .2s infinite linear}
.loading-pm .animation-effect-rot{animation:rot .8s infinite cubic-bezier(0.65,0.05,0.36,1)}
.loading-pm .animation-effect-scale{animation:scale .8s infinite cubic-bezier(0.65,0.05,0.36,1)}
@keyframes effect{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
@keyframes rot{0%{transform:rotate(0deg)}50%{transform:rotate(180deg)}100%{transform:rotate(360deg)}}
@keyframes scale{0%{scale:1}50%{scale:1.9}100%{scale:1}}
.loading-pm .e1{width:1px;height:40px;opacity:.3;position:absolute;top:0;left:8%;background-color:#0f9d58;}
.loading-pm .e2{width:60px;height:1px;opacity:.8;position:absolute;top:8%;left:0;background-color:#4285f4;}
.loading-pm .e3{
  position:absolute;top:10%;left:12%;
  font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;
  font-weight:900;font-size:18px;color:#4285f4;
}
.loading-pm .e4{width:1px;height:40px;opacity:.3;position:absolute;top:90%;right:10%;background-color:#db4437;}
.loading-pm .e5{width:40px;height:1px;opacity:.3;position:absolute;top:100%;right:0;background-color:#f4b400;}
.loading-pm .e6{
  position:absolute;top:100%;right:0;
  font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;
  font-size:32px;color:#0f9d58;
}
.loading-pm .e7{
  width:1px;height:20px;position:absolute;bottom:0;left:0;
  transform:rotate(45deg);
  animation:height 1s infinite cubic-bezier(0.65,0.05,0.36,1);
  background-color:#f4b400;
}
@keyframes height{
  0%{bottom:0;left:0;height:0}25%{height:90px}50%{bottom:100%;left:100%;height:90px}75%{height:0}100%{bottom:0;left:0;height:0}
}
.loading-pm .e8{
  width:20px;height:1px;position:absolute;bottom:50%;left:0;
  animation:width 1.5s infinite cubic-bezier(0.65,0.05,0.36,1);
  background-color:#0f9d58;
}
@keyframes width{
  0%{left:0;width:0}50%{left:100%;width:90px}100%{left:0;width:0}
}

/* ==================== 主样式 ==================== */
:root{
  --bg:#FBF7F0;--card:#FFFFFF;--card-soft:#F5EFE3;
  --line:#EBE1CE;--line-strong:#D9CBAD;
  --ink:#2B2A27;--ink-soft:#6B6154;--ink-faint:#9A8F7A;
  --truth:#4A8DB8;--truth-dark:#376F94;--truth-soft:#E6EFF5;
  --dare:#E8834A;--dare-dark:#C26832;--dare-soft:#FCE9DA;
  --gold:#E8B24E;--gold-dark:#B8853A;--gold-soft:#FAF0D8;
  --green:#7BB89A;
  --chaos:#E8834A;--chaos-dark:#C26832;
  --radius:10px;--radius-sm:6px;
  --font-sans:'ChillRoundF','т»њУЮЅтЁетюєСйЊ',-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  --font-round:'ChillRoundF','т»њУЮЅтЁетюєСйЊ',"PingFang SC","Microsoft YaHei",sans-serif;
  --font-hand:'AliHYAiHei-Beta','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:Georgia,"Times New Roman",serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--font-sans);font-size:15px;line-height:1.7;
  padding:30px 20px 0;
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"tnum" 1;letter-spacing:.005em;
  min-height:100vh;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(circle at 12% 8%, rgba(232,178,78,.10), transparent 42%),
    radial-gradient(circle at 88% 92%, rgba(74,141,184,.10), transparent 42%),
    radial-gradient(circle at 92% 12%, rgba(232,131,74,.07), transparent 40%);
}
.container{
  max-width:1140px;margin:0 auto;
  position:relative;z-index:1;padding-bottom:96px;
}

/* ==================== 头部 ==================== */
.header{
  display:flex;align-items:center;justify-content:center;
  gap:26px;margin-bottom:34px;padding:8px 0 4px;
}
.header-logo{
  width:80px;height:80px;border-radius:50%;object-fit:cover;flex-shrink:0;
  filter:drop-shadow(0 6px 18px rgba(184,133,58,.32));
  animation:logoFloat 3.4s ease-in-out infinite;
}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.header-text{display:inline-flex;flex-direction:column;align-items:stretch}
.header-line1{display:flex;align-items:baseline;gap:16px;line-height:1}
.header-cheers{
  font-family:var(--font-hand);
  font-size:3.4rem;
  font-weight:600;
  letter-spacing:.16em;
  color:var(--dare);
  text-shadow:3px 3px 0 rgba(194,104,50,.18);
  line-height:1;
}
.header-club{
  font-family:var(--font-hand);
  font-size:3.2rem;
  font-weight:500;
  letter-spacing:.06em;
  color:var(--ink);
  line-height:1;
}
.header-divider-line{
  height:1px;width:100%;margin:12px 0 10px;
  background:repeating-linear-gradient(to right,var(--line-strong) 0,var(--line-strong) 5px,transparent 5px,transparent 11px);
}
.header-line2{
  font-family:var(--font-sans);font-size:17px;
  color:var(--ink-soft);letter-spacing:.36em;
  font-weight:600;text-align:left;
  margin-right:-.36em;
}

/* ==================== 卡片区 ==================== */
.cards-panel{
  display:flex;gap:24px;justify-content:center;flex-wrap:wrap;margin-bottom:32px;
}
.folder-card{
  flex:1;min-width:320px;max-width:540px;
  display:flex;flex-direction:column;
  filter:drop-shadow(0 8px 20px rgba(80,60,30,.09));
}
.folder-tab{
  display:inline-flex;align-items:center;gap:11px;
  padding:8px 22px 9px;
  background:var(--folder-color);color:#fff;
  font-family:var(--font-hand);font-size:20px;font-weight:500;
  letter-spacing:.16em;line-height:1.2;
  border-radius:10px 10px 0 0;
  align-self:flex-start;position:relative;z-index:2;
}
.folder-tab .tab-icon{font-size:15px;opacity:.92}
.folder-tab .tab-tag{
  font-family:var(--font-serif);
  font-style:italic;
  font-size:13px;
  font-weight:400;
  letter-spacing:.16em;
  opacity:.88;
  margin-left:6px;
  text-transform:uppercase;
}
.folder-strip{
  height:5px;background:var(--folder-color);width:100%;
  margin-top:-1px;border-radius:0 6px 0 0;
  position:relative;z-index:1;
}
.folder-body{
  background:var(--folder-soft);padding:18px;
  border-radius:0 0 12px 12px;
  display:flex;flex-direction:column;gap:14px;
  position:relative;flex:1;
}
.result-area{
  background:#fff;border:1px solid var(--line);
  border-radius:var(--radius);padding:22px 22px 20px;
  min-height:200px;display:flex;flex-direction:column;
  justify-content:center;position:relative;
  overflow:hidden;flex:1;
}
.result-area::before{
  content:'';position:absolute;top:0;left:0;bottom:0;width:3px;
  background:var(--folder-color);opacity:.6;
}
.result-label{
  display:flex;align-items:center;gap:9px;
  font-size:12px;font-weight:700;
  letter-spacing:.26em;color:var(--ink-faint);
  text-transform:uppercase;margin-bottom:14px;
}
.result-label .dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--folder-color);
  animation:dotPulse 1.6s ease-in-out infinite;
}
@keyframes dotPulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.35;transform:scale(.7)}
}
.result-content{
  font-family:var(--font-round);
  font-size:1.7rem;line-height:1.6;font-weight:400;
  color:var(--ink);word-break:break-word;
  min-height:72px;letter-spacing:.01em;
}
.placeholder{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;
  color:var(--ink-faint);text-align:center;
  font-weight:400;font-style:italic;font-size:16px;
}
.placeholder .ph-emoji{
  font-size:42px;line-height:1;font-style:normal;opacity:.55;
}
.result-id{
  display:flex;align-items:center;gap:8px;
  margin-top:16px;font-size:14px;font-weight:600;
  color:var(--ink-faint);letter-spacing:.06em;
}
.result-id::before{
  content:'';flex:1;height:1px;
  background:repeating-linear-gradient(to right,var(--line-strong) 0,var(--line-strong) 4px,transparent 4px,transparent 9px);
}
.burning-effect{
  display:none;flex-direction:column;align-items:center;
  justify-content:center;padding:20px 0;gap:8px;
}
.burning-effect.active{display:flex}
.burning-loader{
  display:flex;align-items:center;justify-content:center;
  min-height:80px;
}
.burning-text{
  font-family:var(--font-hand);font-size:16px;font-weight:500;
  color:var(--ink-soft);letter-spacing:.16em;
}
.burning-dots::after{
  content:'';animation:dots 1.4s steps(4,end) infinite;
}
@keyframes dots{
  0%{content:''}
  25%{content:'.'}
  50%{content:'..'}
  75%{content:'...'}
  100%{content:''}
}
.progress-bar{
  width:180px;height:5px;background:var(--line);
  border-radius:3px;margin:6px auto 0;
  overflow:hidden;position:relative;
}
.progress-fill{
  height:100%;width:0%;background:var(--folder-color);
  border-radius:3px;transition:width .1s linear;
}

/* 抽取按钮 */
.draw-btn{
  width:100%;display:inline-flex;align-items:center;justify-content:center;
  gap:10px;padding:14px 20px;border:none;
  border-radius:var(--radius-sm);
  font-family:var(--font-hand);
  font-size:20px;font-weight:500;
  letter-spacing:.18em;color:#fff;cursor:pointer;
  background:var(--folder-color);
  box-shadow:4px 4px 0 0 var(--folder-dark);
  transition:transform .12s,box-shadow .12s,filter .15s;
}
.draw-btn .btn-icon{
  font-family:"Font Awesome 6 Free", "Font Awesome 6 Brands" !important;
  font-size:15px;
  letter-spacing:0;
}
.draw-btn:hover{filter:brightness(1.06)}
.draw-btn:active{transform:translate(4px,4px);box-shadow:0 0 0 0 var(--folder-dark)}
.draw-btn:disabled{
  cursor:not-allowed;filter:grayscale(.35);
  opacity:.55;transform:none;
  box-shadow:4px 4px 0 0 var(--folder-dark);
}
.truth-folder{--folder-color:var(--truth);--folder-dark:var(--truth-dark);--folder-soft:var(--truth-soft)}
.dare-folder{--folder-color:var(--dare);--folder-dark:var(--dare-dark);--folder-soft:var(--dare-soft)}

/* ==================== 音乐播放器 ==================== */
.music-player{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:16px 22px 14px 22px;
  box-shadow:0 3px 14px -6px rgba(80,60,30,.1);
  position:relative;
}
.player-controls{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.player-buttons{display:flex;align-items:center;gap:9px;flex-shrink:0}
.player-buttons button{
  width:44px;height:44px;border-radius:50%;
  border:1px solid var(--line);background:var(--card-soft);
  color:var(--ink-soft);font-size:1.05rem;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  font-family:inherit;
  transition:transform .2s ease, box-shadow .2s ease, background .15s, color .15s, border-color .15s;
}
.player-buttons button:hover{
  background:#fff;color:var(--gold-dark);
  border-color:var(--gold);
  transform:translateY(-2px);
  box-shadow:0 6px 18px rgba(232,178,78,.5);
}
.player-buttons button:active{
  transform:translateY(0);
  box-shadow:0 2px 6px rgba(232,178,78,.35);
}
.player-buttons .play-btn{
  width:52px;height:52px;background:var(--gold);
  border-color:var(--gold-dark);color:#fff;font-size:1.2rem;
}
.player-buttons .play-btn:hover{
  background:var(--gold-dark);color:#fff;
  transform:translateY(-2px);
  box-shadow:0 8px 22px rgba(232,178,78,.65);
}
.player-buttons .play-btn:active{
  transform:translateY(0);
  box-shadow:0 2px 8px rgba(232,178,78,.4);
}
.song-info{
  flex:1;min-width:150px;font-size:14px;font-weight:500;
  color:var(--ink-soft);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;display:flex;align-items:center;
  gap:9px;padding:0 4px;
}
.song-info strong{color:var(--ink);font-weight:600}
.playing-animation{
  display:inline-flex;align-items:flex-end;gap:3px;
  height:14px;flex-shrink:0;
}
.playing-animation span{
  width:3px;background:var(--gold);border-radius:2px;
  animation:soundBar .8s infinite ease-in-out;
}
.playing-animation span:nth-child(1){height:7px;animation-delay:0s}
.playing-animation span:nth-child(2){height:12px;animation-delay:.1s}
.playing-animation span:nth-child(3){height:9px;animation-delay:.2s}
.playing-animation span:nth-child(4){height:14px;animation-delay:.3s}
@keyframes soundBar{
  0%,100%{transform:scaleY(.5)}
  50%{transform:scaleY(1)}
}
.volume-ctrl{
  display:flex;align-items:center;gap:11px;flex-shrink:0;
  color:var(--ink-soft);
}
.volume-ctrl > i{font-size:14px}
.slider-wrapper{
  position:relative;display:flex;align-items:center;
  width:120px;height:22px;
}
.slider{
  -webkit-appearance:none;appearance:none;
  width:100%;height:8px;border-radius:4px;
  outline:none;cursor:pointer;
  background:linear-gradient(to right,
    var(--gold) 0%,var(--gold) var(--pct,80%),
    var(--line-strong) var(--pct,80%),var(--line-strong) 100%);
  transition:background .12s linear;
  box-shadow:inset 0 1px 2px rgba(120,90,40,.15);
}
.slider::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:18px;height:18px;border-radius:50%;
  background:#fff;border:3px solid var(--gold);
  box-shadow:0 2px 6px rgba(184,133,58,.4),0 0 0 1px rgba(255,255,255,.6) inset;
  cursor:pointer;
  transition:transform .15s,border-color .15s,box-shadow .15s;
}
.slider::-webkit-slider-thumb:hover{
  transform:scale(1.15);border-color:var(--gold-dark);
  box-shadow:0 4px 10px rgba(184,133,58,.55);
}
.slider::-moz-range-thumb{
  width:18px;height:18px;border-radius:50%;
  background:#fff;border:3px solid var(--gold);
  cursor:pointer;transition:transform .15s;
}
.file-upload{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 18px;border-radius:var(--radius-sm);
  background:var(--card-soft);border:1px solid var(--line);
  color:var(--ink-soft);font-size:13.5px;font-weight:600;
  letter-spacing:.04em;cursor:pointer;transition:all .15s;
  flex-shrink:0;box-shadow:2px 2px 0 0 var(--line-strong);
}
.file-upload:hover{background:#fff;color:var(--gold-dark);border-color:var(--gold)}
.file-upload:active{transform:translate(2px,2px);box-shadow:0 0 0 0 var(--line-strong)}
.file-upload input{display:none}
.playlist-status{
  margin-top:12px;padding-top:10px;
  border-top:1px dashed var(--line-strong);
  font-size:12.5px;color:var(--ink-faint);
  letter-spacing:.02em;text-align:center;
  word-break:break-all;line-height:1.7;
}

/* ==================== CHAOS 弹窗 ==================== */
.chaos-overlay{
  position:fixed;inset:0;background:rgba(43,42,39,.72);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;
  z-index:1000;padding:24px;animation:chaosFade .25s ease;
}
.chaos-overlay.active{display:flex}
@keyframes chaosFade{from{opacity:0}to{opacity:1}}
.chaos-box{
  width:min(620px,100%);
  background:#FDF5E4;
  border:2px solid var(--chaos-dark);
  border-radius:14px;
  padding:36px 36px 30px;
  position:relative;
  box-shadow:
    8px 8px 0 0 var(--chaos-dark),
    0 20px 60px -12px rgba(194,104,50,.4);
  animation:chaosPop .42s cubic-bezier(.34,1.56,.64,1);
  overflow:visible;
}
@keyframes chaosPop{
  0%{opacity:0;transform:scale(.7) rotate(-3deg)}
  60%{opacity:1;transform:scale(1.03) rotate(1deg)}
  100%{opacity:1;transform:scale(1) rotate(0)}
}

/* 标题：But + CHAOS 横排 */
.chaos-header{
  position:relative;
  padding-left:58px;
  margin-bottom:22px;
  z-index:2;
}
.chaos-quote{
  position:absolute;
  left:0;top:-6px;
  width:44px;height:44px;
  color:var(--chaos);
  opacity:.92;
}
.chaos-title-row{
  display:flex;
  align-items:baseline;
  gap:16px;
  flex-wrap:wrap;
}
.chaos-but{
  font-family:var(--font-hand);
  font-size:3.2rem;
  font-weight:600;
  letter-spacing:.06em;
  color:var(--chaos);
  line-height:1;
}
.chaos-word{
  font-family:var(--font-hand);
  font-size:1.8rem;
  font-weight:500;
  letter-spacing:.45em;
  color:var(--chaos);
  opacity:.82;
  line-height:1;
  position:relative;
  top:.15em;
  padding-left:.45em;
}

.chaos-divider{
  width:100%;height:2px;
  margin:0 0 22px 0;
  background:repeating-linear-gradient(to right,var(--chaos) 0,var(--chaos) 6px,transparent 6px,transparent 13px);
  opacity:.5;
  z-index:2;position:relative;
}

.chaos-body{
  text-align:left;
  z-index:2;position:relative;
  padding-bottom:8px;
}
.chaos-name{
  font-family:var(--font-hand);
  font-size:2.4rem;
  font-weight:500;
  letter-spacing:.18em;
  color:var(--chaos-dark);
  margin-bottom:12px;
  line-height:1.2;
}
.chaos-desc{
  font-family:var(--font-round);
  font-size:1.15rem;
  line-height:1.8;
  color:var(--ink);
  font-weight:400;
  letter-spacing:.01em;
  margin-bottom:26px;
}
.chaos-actions{
  text-align:left;
  padding-left:44px;
  z-index:2;position:relative;
}
.chaos-close{
  display:inline-flex;align-items:center;gap:9px;
  padding:13px 40px;
  border:2px solid var(--chaos-dark);
  border-radius:var(--radius-sm);
  background:var(--chaos);
  color:#fff;
  font-family:var(--font-hand);
  font-size:17px;
  font-weight:600;
  letter-spacing:.22em;
  cursor:pointer;
  box-shadow:4px 4px 0 0 var(--chaos-dark);
  transition:transform .12s,box-shadow .12s,filter .15s;
}
.chaos-close .btn-icon{
  font-family:"Font Awesome 6 Free", "Font Awesome 6 Brands" !important;
  font-size:14px;
  letter-spacing:0;
}
.chaos-close:hover{filter:brightness(1.06)}
.chaos-close:active{transform:translate(4px,4px);box-shadow:0 0 0 0 var(--chaos-dark)}

/* 猫：弹窗右下角 */
.chaos-cat{
  position:absolute;
  right:4px;
  bottom:0;
  transform:scale(1.15);
  transform-origin:bottom right;
  pointer-events:none;
  z-index:1;
}
.loader-cat{
  width:fit-content;height:fit-content;
  display:flex;align-items:center;justify-content:center;
}
.loader-cat .wrapper{
  width:fit-content;height:fit-content;
  display:flex;flex-direction:column;
  justify-content:center;align-items:center;
}
.loader-cat .catContainer{
  width:100%;height:fit-content;
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
.loader-cat .catbody{width:50px}
.loader-cat .catbody path{fill:#C26832}
.loader-cat .tail{
  position:absolute;width:11px;top:50%;
  animation:catTail .5s ease-in infinite alternate-reverse;
  transform-origin:top;
}
.loader-cat .tail path{fill:#A85A2A}
@keyframes catTail{
  0%{transform:rotateZ(60deg)}
  50%{transform:rotateZ(0deg)}
  100%{transform:rotateZ(-20deg)}
}
.loader-cat .wall{width:180px}
.loader-cat .wall line{stroke:#D9CBAD}
.loader-cat .text{
  display:flex;flex-direction:column;width:40px;
  position:absolute;margin:0 0 60px 74px;
}
.loader-cat .zzz{
  color:transparent;font-weight:700;font-size:11px;
  animation:zzz 2s linear infinite;
}
.loader-cat .bigzzz{
  color:transparent;font-weight:700;font-size:17px;
  margin-left:8px;animation:zzz 2.3s linear infinite;
}
@keyframes zzz{
  0%{color:transparent}
  50%{color:#C26832}
  100%{color:transparent}
}

/* ==================== 卡片内动画池 ==================== */
/* 粒子线段 */
.loader-boot-anim{
  position:relative;width:2.5em;height:2.5em;
  transform:rotate(165deg);
  font-size:16px;display:inline-block;
}
.loader-boot-anim::before,
.loader-boot-anim::after{
  content:"";position:absolute;top:50%;left:50%;
  display:block;width:.5em;height:.5em;border-radius:.25em;
  transform:translate(-50%,-50%);
}
.loader-boot-anim::before{animation:bootOrigBefore 2s infinite}
.loader-boot-anim::after{animation:bootOrigAfter 2s infinite}
@keyframes bootOrigBefore{
  0%{width:.5em;box-shadow:1em -.5em rgba(201,136,120,.85),-1em .5em rgba(143,169,178,.85)}
  35%{width:2.5em;box-shadow:0 -.5em rgba(201,136,120,.85),0 .5em rgba(143,169,178,.85)}
  70%{width:.5em;box-shadow:-1em -.5em rgba(201,136,120,.85),1em .5em rgba(143,169,178,.85)}
  100%{box-shadow:1em -.5em rgba(201,136,120,.85),-1em .5em rgba(143,169,178,.85)}
}
@keyframes bootOrigAfter{
  0%{height:.5em;box-shadow:.5em 1em rgba(143,168,144,.85),-.5em -1em rgba(201,170,112,.85)}
  35%{height:2.5em;box-shadow:.5em 0 rgba(143,168,144,.85),-.5em 0 rgba(201,170,112,.85)}
  70%{height:.5em;box-shadow:.5em -1em rgba(143,168,144,.85),-.5em 1em rgba(201,170,112,.85)}
  100%{box-shadow:.5em 1em rgba(143,168,144,.85),-.5em -1em rgba(201,170,112,.85)}
}

/* 四色圆环变形 */
.loader-ring{
  width:70px;height:70px;border-radius:50%;
  border:7px solid transparent;
  border-top:7px solid #4A8DB8;
  border-right:7px solid #E8834A;
  border-bottom:7px solid #7BB89A;
  border-left:7px solid #E8B24E;
  animation:ring-rot 1.6s linear infinite,ring-morph 1.6s ease-in-out infinite;
}
@keyframes ring-rot{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes ring-morph{
  0%,100%{border-radius:50%;width:70px;height:70px}
  50%{border-radius:10%;width:86px;height:86px}
}

/* 9 方块波浪 */
.loader-grid-anim{
  --sq-size:10px;--sq-gap:4px;--sq-radius:2.5px;--sq-color:#4A8DB8;
  display:inline-grid;
  grid-template-columns:repeat(3,var(--sq-size));
  grid-template-rows:repeat(3,var(--sq-size));
  gap:var(--sq-gap);
}
.loader-grid-anim > span{
  display:block;width:var(--sq-size);height:var(--sq-size);
  background:var(--sq-color);border-radius:var(--sq-radius);
  opacity:.3;transform:scale(.55);
  animation:sqWave 1.15s ease-in-out infinite;
}
.loader-grid-anim > span:nth-child(1){animation-delay:0s}
.loader-grid-anim > span:nth-child(2){animation-delay:.09s}
.loader-grid-anim > span:nth-child(3){animation-delay:.18s}
.loader-grid-anim > span:nth-child(4){animation-delay:.09s}
.loader-grid-anim > span:nth-child(5){animation-delay:.18s}
.loader-grid-anim > span:nth-child(6){animation-delay:.27s}
.loader-grid-anim > span:nth-child(7){animation-delay:.18s}
.loader-grid-anim > span:nth-child(8){animation-delay:.27s}
.loader-grid-anim > span:nth-child(9){animation-delay:.36s}
@keyframes sqWave{
  0%,65%,100%{opacity:.3;transform:scale(.55)}
  30%{opacity:1;transform:scale(1)}
}
.truth-folder .loader-grid-anim{--sq-color:#5BA3C7}
.dare-folder .loader-grid-anim{--sq-color:#E8834A}

/* 三层圆锥渐变 */
.spin-loader{
  width:96px;height:96px;border-radius:50%;
  position:relative;display:flex;
  justify-content:center;align-items:center;
  animation:spin3 3s linear infinite;
  background:conic-gradient(#4A8DB8 0deg,#4A8DB8 300deg,transparent 270deg,transparent 360deg);
}
.spin-loader::before{
  content:"";position:absolute;
  width:60%;height:60%;border-radius:50%;
  animation:spin2 2s linear infinite;
  background:conic-gradient(#E8B24E 0deg,#E8B24E 270deg,transparent 180deg,transparent 360deg);
  z-index:8;
}
.spin-loader::after{
  content:"";position:absolute;
  width:75%;height:75%;border-radius:50%;
  animation:spin3 3s linear infinite;
  background:conic-gradient(#E8834A 0deg,#E8834A 180deg,transparent 180deg,transparent 360deg);
  z-index:6;
}
.spin-loader > span{
  position:absolute;width:85%;height:85%;border-radius:50%;
  animation:spin5 5s linear infinite;
  background:conic-gradient(#7BB89A 0deg,#7BB89A 180deg,transparent 180deg,transparent 360deg);
  z-index:6;
}
@keyframes spin2{to{transform:rotate(360deg)}}
@keyframes spin3{to{transform:rotate(360deg)}}
@keyframes spin5{to{transform:rotate(360deg)}}

/* 10 根竖条 */
.loader-bars-anim{
  display:flex;justify-content:center;align-items:center;
}
.loader-bars-anim .bar{
  width:7px;height:16px;margin:0 2px;border-radius:3px;
  animation:barWave 2s ease-in-out infinite;
}
.loader-bars-anim .bar:nth-child(1){background:#4A8DB8;animation-delay:-.8s}
.loader-bars-anim .bar:nth-child(2){background:#5BA3C7;animation-delay:-.7s}
.loader-bars-anim .bar:nth-child(3){background:#7BB89A;animation-delay:-.6s}
.loader-bars-anim .bar:nth-child(4){background:#9DC4A8;animation-delay:-.5s}
.loader-bars-anim .bar:nth-child(5){background:#E8B24E;animation-delay:-.4s}
.loader-bars-anim .bar:nth-child(6){background:#E8B24E;animation-delay:-.3s}
.loader-bars-anim .bar:nth-child(7){background:#EFA963;animation-delay:-.2s}
.loader-bars-anim .bar:nth-child(8){background:#E8834A;animation-delay:-.1s}
.loader-bars-anim .bar:nth-child(9){background:#D97540;animation-delay:0s}
.loader-bars-anim .bar:nth-child(10){background:#C26832;animation-delay:.1s}
@keyframes barWave{
  0%{transform:scale(1)}
  20%{transform:scale(1,2.32)}
  40%{transform:scale(1)}
}

/* 水滴融合 */
.loader-goo-wrap{
  width:80px;height:80px;
  position:relative;
  display:flex;align-items:center;justify-content:center;
}
.loader-goo-scale{
  position:absolute;
  top:50%;left:50%;
  width:200px;height:200px;
  margin:-100px 0 0 -100px;
  transform:scale(.4);
  transform-origin:center center;
}
.loader-goo{
  width:200px;height:200px;
  position:relative;
  filter:url("#goo");
  animation:goo-rotate 2s ease-in-out infinite;
}
.loader-goo .dot{
  width:70px;height:70px;border-radius:50%;
  position:absolute;top:0;bottom:0;left:0;right:0;margin:auto;
}
.loader-goo .dot-3{background:#E8834A;animation:dot-3-move 2s ease infinite,dot-index 6s ease infinite}
.loader-goo .dot-2{background:#4A8DB8;animation:dot-2-move 2s ease infinite,dot-index 6s -4s ease infinite}
.loader-goo .dot-1{background:#E8B24E;animation:dot-1-move 2s ease infinite,dot-index 6s -2s ease infinite}
@keyframes dot-3-move{
  20%{transform:scale(1)}
  45%{transform:translateY(-18px) scale(.45)}
  60%{transform:translateY(-90px) scale(.45)}
  80%{transform:translateY(-90px) scale(.45)}
  100%{transform:translateY(0) scale(1)}
}
@keyframes dot-2-move{
  20%{transform:scale(1)}
  45%{transform:translate(-16px,12px) scale(.45)}
  60%{transform:translate(-80px,60px) scale(.45)}
  80%{transform:translate(-80px,60px) scale(.45)}
  100%{transform:translateY(0) scale(1)}
}
@keyframes dot-1-move{
  20%{transform:scale(1)}
  45%{transform:translate(16px,12px) scale(.45)}
  60%{transform:translate(80px,60px) scale(.45)}
  80%{transform:translate(80px,60px) scale(.45)}
  100%{transform:translateY(0) scale(1)}
}
@keyframes goo-rotate{
  55%{transform:rotate(0deg)}
  80%{transform:rotate(360deg)}
  100%{transform:rotate(360deg)}
}
@keyframes dot-index{
  0%,100%{z-index:3}
  33.3%{z-index:2}
  66.6%{z-index:1}
}

/* 金色 spinner */
.loader-spinner-anim{
  border:7px solid #E8DCC4;
  border-top:7px solid #E8B24E;
  border-radius:50%;
  width:60px;height:60px;
  position:relative;
  animation:spinnerRot 2s linear infinite;
}
.loader-spinner-anim::after{
  content:"";position:absolute;
  top:-7px;left:-7px;right:-7px;bottom:-7px;
  border-radius:50%;
  box-shadow:inset 0 0 16px #E8B24E;
}
@keyframes spinnerRot{to{transform:rotate(360deg)}}

/* ==================== 右下角重置 ==================== */
.reset-float{
  position:fixed;right:20px;bottom:20px;
  width:46px;height:46px;border-radius:50%;
  background:var(--card);border:1px solid var(--line);
  color:var(--ink-soft);font-size:1rem;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  z-index:100;
  transition:all .15s;
}
.reset-float:hover{
  color:var(--dare);border-color:var(--dare);
  transform:translate(-1px,-1px);
}
.reset-float:active{transform:translate(0,0)}

/* ==================== Toast ==================== */
.toast-tip{
  position:fixed;top:26px;left:50%;
  transform:translateX(-50%) translateY(-16px);
  background:rgba(43,42,39,.93);color:#F5EFE3;
  padding:12px 26px;border-radius:100px;
  font-size:13.5px;font-weight:500;letter-spacing:.04em;
  z-index:2000;opacity:0;pointer-events:none;
  transition:all .28s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 8px 24px -6px rgba(0,0,0,.35);
  max-width:calc(100vw - 40px);text-align:center;
}
.toast-tip.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ==================== 响应式 ==================== */
@media (max-width:768px){
  body{padding:20px 12px 0}
  .container{padding-bottom:72px}
  .header{gap:16px;margin-bottom:24px}
  .header-logo{width:60px;height:60px}
  .header-cheers{font-size:2.4rem;letter-spacing:.12em}
  .header-club{font-size:2.2rem}
  .header-line2{font-size:14px;letter-spacing:.28em}
  .folder-card{min-width:100%}
  .folder-tab{font-size:17px;padding:7px 18px 8px;letter-spacing:.14em}
  .folder-tab .tab-tag{font-size:11px}
  .result-content{font-size:1.4rem}
  .chaos-but{font-size:2.4rem}
  .chaos-word{font-size:1.3rem;letter-spacing:.36em;padding-left:.36em}
  .chaos-name{font-size:1.9rem}
  .chaos-desc{font-size:1rem}
  .chaos-actions{padding-left:0;text-align:center}
  .chaos-cat{transform:scale(.75);transform-origin:bottom right}
  .player-controls{flex-direction:column;align-items:stretch}
  .player-buttons{justify-content:center}
  .song-info{text-align:center;justify-content:center}
  .volume-ctrl{justify-content:center}
  .file-upload{justify-content:center}
  .reset-float{width:42px;height:42px;right:14px;bottom:14px}
  .enter-text{font-size:20px}
  .enter-inner{gap:90px}
  .loading-pm .loading-wide{transform:scale(.85)}
  .draw-btn{font-size:17px}
}
</style>

/* ==================== 打字机 ==================== */
function typeWriter(el, text, speed, cb){
  el.innerHTML = '';
  let i = 0;
  function step(){
    if (i < text.length){
      el.innerHTML += text.charAt(i);
      i++;
      setTimeout(step, speed);
    } else if (cb) cb();
  }
  step();
}

/* ==================== 烧录动画 ==================== */
function playBurningAnimation(type, cb){
  const contentEl = type === 'truth' ? truthContent : dareContent;
  const burningEl = type === 'truth' ? truthBurning : dareBurning;
  const loaderEl  = type === 'truth' ? truthLoader : dareLoader;
  const progressEl = type === 'truth' ? truthProgress : dareProgress;
  const idEl = type === 'truth' ? truthId : dareId;

  loaderEl.innerHTML = nextLoaderHTML();

  contentEl.style.display = 'none';
  burningEl.classList.add('active');
  idEl.style.display = 'none';

  let progress = 0;
  progressEl.style.width = '0%';
  const interval = setInterval(() => {
    progress += Math.random() * 15 + 5;
    if (progress >= 100){
      progress = 100;
      clearInterval(interval);
      setTimeout(() => {
        burningEl.classList.remove('active');
        contentEl.style.display = 'block';
        idEl.style.display = 'flex';
        cb();
      }, 300);
    }
    progressEl.style.width = progress + '%';
  }, 100);
}

/* ==================== 抽题 ==================== */
function drawFromPool(pool){
  const idx = Math.floor(Math.random() * pool.length);
  return pool.splice(idx, 1)[0];
}

function updateTruth(){
  if (truthPool.length === 0) return;
  truthBtn.disabled = true;
  playBurningAnimation('truth', () => {
    const item = drawFromPool(truthPool);
    typeWriter(truthContent, item, 25, () => {
      setTimeout(() => {
        const willChaos = forceChaos || Math.random() < 0.2;
        forceChaos = false;
        if (willChaos) showChaos();
      }, 450);
    });
    truthId.innerHTML = '<span style="opacity:.6">━━━━━</span> 真心话 · 剩余 ' + truthPool.length + ' 题';
    truthBtn.disabled = false;
    updateButtonStates();
  });
}

function updateDare(){
  if (darePool.length === 0) return;
  dareBtn.disabled = true;
  playBurningAnimation('dare', () => {
    const item = drawFromPool(darePool);
    typeWriter(dareContent, item, 25, () => {

    dareBtn.disabled = false;
    updateButtonStates();
  });
}

}
chaosCloseBtn.addEventListener('click', closeChaos);

/* ==================== 音乐播放器 ==================== */
function getPlayingAnimation(){
  return '<span class="playing-animation"><span></span><span></span><span></span><span></span></span>';
}

function updatePlaylistUI(){
  if (playlist.length === 0){
    playlistStatusEl.textContent = '播放列表空空如也 · 点击「添加音乐」导入 BGM';
    songInfoEl.innerHTML = '<span>未播放 · 点击播放开始</span>';
    return;
  }
  const current = playlist[currentTrackIndex];
  const names = playlist.map((t, i) => i === currentTrackIndex ? '▶ ' + t.name : t.name).join(' · ');
  playlistStatusEl.textContent = '播放列表 (' + (currentTrackIndex + 1) + '/' + playlist.length + ')：' + names;
  if (current){
    songInfoEl.innerHTML = (isPlaying ? getPlayingAnimation() : '<i class="fas fa-pause" style="opacity:.6"></i>') +
      '<strong>' + current.name + '</strong>';
  }
}

function loadTrack(index){
  if (playlist.length === 0) return;
  audio.src = playlist[index].url;
  audio.load();
  if (isPlaying) audio.play().catch(() => {});
  updatePlaylistUI();
}
function playCurrent(){
  if (playlist.length === 0){ showToast('请先添加音乐文件'); return; }
  audio.play().then(() => {
    isPlaying = true;
    playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
    updatePlaylistUI();
  }).catch(() => {
    isPlaying = false;
    playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
  });
}
function pauseCurrent(){
  audio.pause();
  isPlaying = false;
  playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
  updatePlaylistUI();
}
function togglePlayPause(){
  if (playlist.length === 0){ showToast('请先添加音乐文件'); return; }
  if (isPlaying) pauseCurrent();
  else playCurrent();
}
playPauseBtn.addEventListener('click', (e) => {
  if (e.detail > 0 && isPlaying){
    forceChaos = true;
  }
  togglePlayPause();
});

function nextTrack(){
  if (playlist.length === 0) return;
  currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
  loadTrack(currentTrackIndex);
  if (isPlaying) playCurrent();
}
function prevTrack(){
  if (playlist.length === 0) return;
  currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
  loadTrack(currentTrackIndex);
  if (isPlaying) playCurrent();
}
function addSongs(files){
  let added = 0;
  for (const file of files){
    if (file.type.startsWith('audio/')){
      const url = URL.createObjectURL(file);
      playlist.push({ name: file.name.replace(/\.[^/.]+$/, ''), url });
      added++;
    }
  }
  if (added > 0 && !audio.src){
    currentTrackIndex = 0;
    loadTrack(0);
  }
  updatePlaylistUI();
  if (added > 0) showToast('已添加 ' + added + ' 首');
}
musicUpload.addEventListener('change', (e) => {
  addSongs(Array.from(e.target.files));
  musicUpload.value = '';
});
prevBtn.addEventListener('click', prevTrack);
nextBtn.addEventListener('click', nextTrack);
audio.addEventListener('ended', nextTrack);

function updateVolumeFill(){
  volumeEl.style.setProperty('--pct', volumeEl.value + '%');
}
volumeEl.addEventListener('input', () => {
  audio.volume = volumeEl.value / 100;
  updateVolumeFill();
});
audio.volume = volumeEl.value / 100;
updateVolumeFill();

window.addEventListener('beforeunload', () => {
  playlist.forEach(t => URL.revokeObjectURL(t.url));
});

/* ==================== 重置 ==================== */
resetFloat.addEventListener('click', () => {
  truthPool = [...truthList];
  darePool  = [...dareList];
  updateButtonStates();
  truthId.textContent = '等待抽取';
  dareId.textContent  = '等待抽取';
  truthContent.innerHTML = '<div class="placeholder"><div class="ph-emoji">🤔</div><div>点击下方按钮，解锁一个灵魂拷问</div></div>';
  dareContent.innerHTML  = '<div class="placeholder"><div class="ph-emoji">🎲</div><div>点击下方按钮，接受命运的安排</div></div>';
  forceChaos = false;
  showToast('题库已重置');
});

/* ==================== 快捷键 ==================== */
document.addEventListener('keydown', (e) => {
  if (!entered){
    if (e.code === 'Space' || e.code === 'Enter'){
      e.preventDefault();
      enterExperience();
    }
    return;
  }
  if (chaosOverlay.classList.contains('active')){
    if (e.code === 'Space' || e.code === 'Escape' || e.code === 'Enter'){
      e.preventDefault();
      closeChaos();
    }
    return;
  }
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;

  if (e.code === 'KeyF'){
    e.preventDefault();
    toggleFullscreen();
    return;
  }
  if (e.code === 'Space'){
    e.preventDefault();
    togglePlayPause();
  } else if (e.code === 'Digit1'){
    e.preventDefault();
    if (!truthBtn.disabled) updateTruth();
  } else if (e.code === 'Digit2'){
    e.preventDefault();
    if (!dareBtn.disabled) updateDare();
  }
});

/* ==================== 初始化 ==================== */
updateButtonStates();
updatePlaylistUI();
</script>
