<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雾紫晴空 · 背景 v2</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  /* 与 shader 同一套配色，场景就绪前不闪白 */
  body { background: linear-gradient(180deg, #A9BDD8 0%, #BFCBDF 40%, #E0DCC8 72%, #F4EFDD 100%); }
  canvas { display: block; }
</style>
<!-- UMD 版 Three.js：经典 script 标签，file:// 双击打开也能跑，离线可用 -->
<script src="./three.min.js"></script>
</head>
<body>
<script>
const THREE = window.THREE;

/* ============================================================
   晨光奶蓝天 · cartier-sky-background2
   设计目标：简约清新、退居卡片之后的背景。
   - 天空：四段色阶（天蓝→晨光奶油），左下角一抹暖晨光
   - 云：程序生成的柔和有机形（软边泡状叠加 + 冷调底影），
     彻底避开 v1 的图标贴纸感
   - 构图：远 / 中 / 近三层，上部留白给标题，
     卡片正后方保持干净（继承 v1 的面板避让机制）
   - 质感：静态纸面颗粒（印刷感），消除大面积渐变的数字味
   - 动效：云极慢漂移 + 轻微鼠标视差，后台自动停渲染
   ============================================================ */

/* ---------------------------------------------------------------- 工具 */

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const lerp = (a, b, t) => a + (b - a) * t;

/* ------------------------------------------------- 柔和有机云贴图 */

// 借鉴 Uiverse「BB-8 开关」（Galahhad）的云技法：一个小核 + 一圈错落偏移泡，
// 整朵同一个大模糊、同一个半透明白——软到没有明确轮廓，是"一团云的雾"。
// 与之前的积云剪影是两种语言（那个是"一朵云的形"，这个是"一团云的雾"），
// 用户点名要试这个，故整体替换贴图生成方式；Three.js 架构不变。
function makeCloudTexture(seed) {
  const S = 512;
  const rnd = mulberry32(seed);

  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = S;
  const ctx = canvas.getContext('2d');

  const flip = rnd() < 0.5;
  const cx = S * 0.50;
  const cy = S * 0.54;

  // 泡组：[水平偏移, 垂直偏移, 宽, 高]（倍 S）。横向链式排列——
  // 中间高两头低，是一朵云的剪影节奏（散乱簇会像爪子印）。
  // 注意：BB-8 原版是开关里的小尺寸，搬到全屏背景后整体放大 1.35 倍、
  // 压扁度从 0.75 放到 0.85——小尺寸上是"精致"，大尺寸上不变大就是"虚"
  const puffs = [
    [-0.225,  0.060, 0.160, 0.082],
    [-0.100, -0.040, 0.200, 0.098],
    [ 0.060, -0.088, 0.190, 0.092],
    [ 0.200,  0.000, 0.160, 0.080],
    [ 0.305,  0.072, 0.115, 0.062],
  ];

  const drawn = [];
  for (const [dx, dy, w, h] of puffs) {
    drawn.push({
      x: cx + dx * S * (1 + (rnd() - 0.5) * 0.35),
      y: cy + dy * S * (1 + (rnd() - 0.5) * 0.35),
      rx: w * S * (0.9 + rnd() * 0.2) / 2,
      ry: h * S * 0.85 * (0.9 + rnd() * 0.2) / 2,
    });
  }

  // 包围盒（供明暗渐变和宽高比起算）
  let minY = S, maxY = 0, minX = S, maxX = 0;
  for (const p of drawn) {
    minY = Math.min(minY, p.y - p.ry); maxY = Math.max(maxY, p.y + p.ry);
    minX = Math.min(minX, p.x - p.rx); maxX = Math.max(maxX, p.x + p.rx);
  }

  ctx.save();
  if (flip) { ctx.translate(S, 0); ctx.scale(-1, 1); }

  // 两层结构。踩过的坑：单层半透明 + 大模糊会淡到几乎看不见
  //（第一版借鉴时就是这样，截图才发现）。现在是：
  // ① 雾晕：16px 大模糊、0.70 白——向外消散的空气感
  // ② 云体：同一组泡放大 1.15 倍、8px 中模糊、0.98 白——可读的"云"
  // 两层同色系叠加，边界同等柔软，不会出现拼贴缝
  ctx.filter = 'blur(16px)';
  ctx.fillStyle = 'rgba(255,255,255,0.70)';
  for (const p of drawn) {
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, p.rx, p.ry, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.filter = 'blur(8px)';
  ctx.fillStyle = 'rgba(255,255,255,0.98)';
  for (const p of drawn) {
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, p.rx * 1.15, p.ry * 1.15, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.filter = 'none';
  ctx.restore();

  // 明暗：只压一层极淡的雾紫灰在底部，保持"白雾"主调
  const grad = ctx.createLinearGradient(0, minY, 0, maxY);
  grad.addColorStop(0.00, '#ffffff');
  grad.addColorStop(0.55, '#f6f5f9');
  grad.addColorStop(1.00, '#dcdae6');
  ctx.globalCompositeOperation = 'source-atop';
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, S, S);
  ctx.globalCompositeOperation = 'source-over';

  const tex = new THREE.CanvasTexture(canvas);
  tex.encoding = THREE.sRGBEncoding;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.generateMipmaps = true;
  tex.userAspect = (maxX - minX) / (maxY - minY);
  return tex;
}

/* --------------------------------------------------------- 渲染器 */

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 0, 12);

/* ------------------------------------------------------------- 天空 */

const skyUniforms = {
  uTime:  { value: 0 },
  uAspect:{ value: innerWidth / innerHeight },
};

const sky = new THREE.Mesh(
  new THREE.PlaneGeometry(1, 1),
  new THREE.ShaderMaterial({
    uniforms: skyUniforms,
    depthWrite: false,
    vertexShader: /* glsl */`
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: /* glsl */`
      uniform float uTime;
      uniform float uAspect;
      varying vec2 vUv;

      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
      }
      float noise(vec2 p) {
        vec2 i = floor(p), f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
                   mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
      }
      float fbm(vec2 p) {
        float v = 0.0, a = 0.5;
        mat2 m = mat2(1.62, 1.18, -1.18, 1.62);
        for (int i = 0; i < 4; i++) { v += a * noise(p); p = m * p; a *= 0.5; }
        return v;
      }

      void main() {
        // 方案 G：莫奈《晨雾塞纳河》雾紫灰蓝 × 梵高《麦田》铬黄暖光
        vec3 top = vec3(0.663, 0.741, 0.847);   // #A9BDD8 雾蓝
        vec3 mid = vec3(0.749, 0.796, 0.875);   // #BFCBDF 灰紫雾
        vec3 low = vec3(0.878, 0.863, 0.784);   // #E0DCC8 转向暖金
        vec3 hor = vec3(0.957, 0.937, 0.867);   // #F4EFDD 奶油地平线

        float t = uTime * 0.004;
        vec3 col = mix(hor, low, smoothstep(0.00, 0.22, vUv.y));
        col = mix(col, mid, smoothstep(0.30, 0.62, vUv.y));
        col = mix(col, top, smoothstep(0.58, 1.00, vUv.y));

        // 左下角一抹铬黄暖阳（梵高麦田的 #EBD48A），很淡
        vec2 gp = vec2(0.16, 0.06);
        float gd = distance(vec2(vUv.x * uAspect, vUv.y), vec2(gp.x * uAspect, gp.y));
        col = mix(col, vec3(0.922, 0.831, 0.541), exp(-gd * 2.1) * 0.32);

        // 高空一层极淡的流动薄雾，让大片蓝色不死板
        vec2 p = vec2(vUv.x * uAspect, vUv.y) * 2.2;
        float haze = fbm(p + vec2(t, t * 0.35));
        col = mix(col, vec3(1.0, 0.99, 0.96), smoothstep(0.52, 0.98, haze) * 0.08);

        // 静态纸面颗粒：坐标不随时间变，是"印上去"的颗粒而不是噪点闪烁
        float grain = hash(floor(gl_FragCoord.xy)) - 0.5;
        col += grain * 0.016;

        // 抖动，消除大面积渐变的色带
        col += (hash(vUv * 1024.0) - 0.5) * 0.006;

        gl_FragColor = vec4(col, 1.0);
      }
    `,
  })
);
sky.position.z = -60;
sky.renderOrder = -1;
scene.add(sky);

/* ------------------------------------------------------------- 云 */

const cloudTex = [
  makeCloudTexture(11), makeCloudTexture(29), makeCloudTexture(47),
  makeCloudTexture(83), makeCloudTexture(127),
];
const cloudGeo = new THREE.PlaneGeometry(1, 1);

const tanHalfFov = Math.tan(THREE.MathUtils.degToRad(45) / 2);

// 三层景深。层内：同一 cross（飘过整屏的秒数）+ 初始均匀铺位，
// 层内间距永远均匀。层间：越近的云越大、越不透明、飘得越快，
// 形成自然的视差纵深。上部留白给标题区，卡片正后方保持干净。
const LAYERS = [
  { cross: 104, clouds: [
    { z: -42, h: 3.8, y:  8.5, tex: 0, op: 0.62 },
    { z: -40, h: 4.4, y:  5.0, tex: 1, op: 0.70 },
    { z: -38, h: 3.4, y: 10.5, tex: 2, op: 0.58 },
    { z: -36, h: 4.0, y:  2.6, tex: 3, op: 0.72 },
  ]},
  { cross: 82, clouds: [
    { z: -26, h: 6.4, y:  6.2, tex: 4, op: 0.84 },
    { z: -24, h: 8.2, y: -2.6, tex: 1, op: 0.90 },
    { z: -22, h: 5.6, y:  3.0, tex: 2, op: 0.82 },
  ]},
  { cross: 64, clouds: [
    { z: -14, h: 11.0, y: -4.2, tex: 0, op: 0.95, below: true },
    { z: -12, h:  8.8, y:  5.4, tex: 3, op: 0.92 },
  ]},
];

// 层内初始铺位序号（必须先写回布局对象：下面建云时是浅拷贝，
// 后补 slot 的话副本里拿到的是 undefined，初始 x 会变成 NaN，云整批消失）
for (const layer of LAYERS) {
  layer.clouds.forEach((c, i) => { c.slot = i; c.count = layer.clouds.length; });
}

const clouds = [];
for (const layer of LAYERS) {
  for (const c of layer.clouds) {
    const w = c.h * cloudTex[c.tex].userAspect;
    const mesh = new THREE.Mesh(cloudGeo, new THREE.MeshBasicMaterial({
      map: cloudTex[c.tex],
      transparent: true,
      opacity: c.op,
      depthWrite: false,
    }));
    mesh.scale.set(w, c.h, 1);
    mesh.position.set(0, c.y, c.z);
    scene.add(mesh);
    clouds.push({ mesh, layer, w, halfW: 0, wrap: 0, speed: 0, placed: false,
                  bob: 0.24 + Math.random() * 0.30,
                  period: 9 + Math.random() * 4,
                  phase: Math.random() * Math.PI * 2, ...c });
  }
}

// 每朵云露出面板上缘的高度（占自身半高），参差但不排成整齐横排
const PEEK = [0.35, 0.05, 0.5, 0.2, 0.65, 0.3, 0.42, 0.15, 0.55];

function getPanelRect() {
  try {
    const panel = window.parent.document.querySelector('.cards-panel');
    if (panel) return panel.getBoundingClientRect();
  } catch (e) { /* file:// 跨源访问被拦，走兜底 */ }
  // 兜底：按主页面布局近似——卡片面板占中下部，云在上面缘参差露头
  return { top: innerHeight * 0.42, bottom: innerHeight,
           width: innerWidth, height: innerHeight * 0.58 };
}

function layoutClouds() {
  const pr = getPanelRect();

  clouds.forEach((c, idx) => {
    const dist = camera.position.z - c.z;
    const halfH = dist * tanHalfFov;
    const visibleHalf = halfH * camera.aspect;
    c.halfW = visibleHalf * 1.4;
    c.wrap = c.halfW * 2;
    c.speed = (visibleHalf * 2) / c.layer.cross;

    if (pr) {
      const toWorld = (sy) => (1 - 2 * sy / innerHeight) * halfH;
      const bandTop = toWorld(pr.top), bandBottom = toWorld(pr.bottom);
      const halfCloud = c.h / 2;
      const blocked = (c.y + c.bob + halfCloud > bandBottom) &&
                      (c.y - c.bob - halfCloud < bandTop);
      if (blocked) {
        if (c.below || bandTop + halfCloud * 1.3 >= halfH) {
          c.y = bandBottom - halfCloud * 0.85;          // 沉到面板下面
        } else {
          c.y = bandTop + halfCloud * PEEK[idx % PEEK.length]; // 压到上缘露一点
        }
      }
    }

    if (!c.placed) {
      // 层内按槽位均匀铺满整屏
      c.mesh.position.x = ((c.slot + 0.5) / c.count * 2 - 1) * visibleHalf;
      c.mesh.position.y = c.y;
      c.placed = true;
    } else {
      c.mesh.position.x = ((c.mesh.position.x + c.halfW) % c.wrap + c.wrap) % c.wrap - c.halfW;
    }
  });
}

/* ---------------------------------------------------- 交互与自适应 */

const pointer = { x: 0, y: 0 };
const smooth  = { x: 0, y: 0 };
addEventListener('pointermove', (e) => {
  pointer.x = (e.clientX / innerWidth - 0.5) * 2;
  pointer.y = (e.clientY / innerHeight - 0.5) * 2;
});

function resize() {
  const aspect = innerWidth / innerHeight;
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  skyUniforms.uAspect.value = aspect;

  const h = 2 * tanHalfFov * Math.abs(camera.position.z - sky.position.z);
  sky.scale.set(h * aspect * 1.2, h * 1.2, 1);
  layoutClouds();
}
addEventListener('resize', resize);
resize();

/* -------------------------------------------------------- 主循环 */

const clock = new THREE.Clock();
let elapsed = 0;

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  for (const c of clouds) {
    c.mesh.position.x += c.speed * dt;
    if (c.mesh.position.x > c.halfW) c.mesh.position.x -= c.wrap;
    c.mesh.position.y = c.y + Math.sin(elapsed * (Math.PI * 2 / c.period) + c.phase) * c.bob;
  }

  // 极慢自摆 + 一点点跟随鼠标，量刻意压小：是"活"，不是"动"
  const swayX = Math.sin(elapsed * 0.05) * 0.32 + pointer.x * 0.42;
  const swayY = Math.cos(elapsed * 0.041) * 0.18 - pointer.y * 0.28;
  smooth.x += (swayX - smooth.x) * 0.02;
  smooth.y += (swayY - smooth.y) * 0.02;
  camera.position.x = smooth.x;
  camera.position.y = smooth.y;
  camera.lookAt(0, 0, -20);

  skyUniforms.uTime.value = elapsed;
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(tick);

// 切到后台时停掉渲染，回来继续
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    renderer.setAnimationLoop(null);
  } else {
    clock.getDelta();
    renderer.setAnimationLoop(tick);
  }
});
</script>
</body>
</html>
