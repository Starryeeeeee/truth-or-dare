<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>卡通蓝天白云 · 背景</title>
<style>
  html, body { margin: 0; height: 100%; background: #92c3e6; overflow: hidden; }
  canvas { display: block; }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';

/* ---------------------------------------------------------------- 工具 */

// 固定种子的随机，保证每次刷新云的形状是同一套
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ------------------------------------------- 卡通云贴图（直接用现成路径） */

// 云形取自 Bootstrap Icons 的 cloud-fill（MIT 授权），路径原样栅格化。
// 之前自己用球体拼：垫了一块压扁椭圆当"平底"，结果它比鼓包还宽、
// 两端收斜，在云底下露出一块梯形板子。现成路径的平底是路径本身
// 画出来的，没有这个问题。
const CLOUD_PATH = "M4.406 3.342A5.53 5.53 0 0 1 8 2c2.69 0 4.923 2 5.166 4.579C14.758 6.804 16 8.137 16 9.773 16 11.569 14.502 13 12.687 13H3.781C1.708 13 0 11.366 0 9.318c0-1.763 1.266-3.223 2.942-3.593.143-.863.698-1.723 1.464-2.383";
// 这条路径在 16×16 viewBox 里的实际占位
const CLOUD_BOX = { x0: 0, y0: 2, x1: 16, y1: 13 };

function makeCloudTexture(seed) {
  const S = 320;
  const rnd = mulberry32(seed);

  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = S;
  const ctx = canvas.getContext('2d');

  // 每朵云镜像 + 轻微压扁各不相同，避免六朵一模一样
  const flip = rnd() < 0.5;
  const squash = 0.95 + rnd() * 0.10;

  ctx.save();
  ctx.scale(S / 16, (S / 16) * squash);
  if (flip) { ctx.scale(-1, 1); ctx.translate(-16, 0); }
  ctx.fillStyle = '#fff';
  ctx.fill(new Path2D(CLOUD_PATH));
  ctx.restore();

  // 明暗按云的真实占位铺：顶部亮白 -> 底部冷蓝影。
  // 中间不放暖色——之前这里有个杏奶油色停靠点，夹在白和冷蓝之间，
  // 在云身中部形成一条米黄横带，看着像谁画了一道黄线
  const yTop = (CLOUD_BOX.y0 / 16) * S * squash;
  const yBot = (CLOUD_BOX.y1 / 16) * S * squash;
  const grad = ctx.createLinearGradient(0, yTop, 0, yBot);
  grad.addColorStop(0.00, '#ffffff');
  grad.addColorStop(0.55, '#fefefe');
  grad.addColorStop(0.80, '#e9eef7');
  grad.addColorStop(1.00, '#c9d6ee');
  ctx.globalCompositeOperation = 'source-atop';
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, S, S);
  ctx.globalCompositeOperation = 'source-over';

  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.generateMipmaps = true;
  tex.userAspect = (CLOUD_BOX.x1 - CLOUD_BOX.x0) / ((CLOUD_BOX.y1 - CLOUD_BOX.y0) * squash);
  return tex;
}

/* --------------------------------------------------------- 渲染器 */

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 0, 12);

// 天空：偏暖的卡通蓝，往下走到奶油色地平线，和暖奶油页面挨着不打架
const skyUniforms = {
  uTime:  { value: 0 },
  uAspect:{ value: innerWidth / innerHeight },
};

const sky = new THREE.Mesh(
  new THREE.PlaneGeometry(1, 1),
  new THREE.ShaderMaterial({
    uniforms: skyUniforms,
    depthWrite: false,
    vertexShader: /* glsl */`
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: /* glsl */`
      uniform float uTime;
      uniform float uAspect;
      varying vec2 vUv;

      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
      }
      float noise(vec2 p) {
        vec2 i = floor(p), f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
                   mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
      }
      float fbm(vec2 p) {
        float v = 0.0, a = 0.5;
        mat2 m = mat2(1.62, 1.18, -1.18, 1.62);
        for (int i = 0; i < 4; i++) { v += a * noise(p); p = m * p; a *= 0.5; }
        return v;
      }

      void main() {
        // 暖调卡通蓝 -> 奶油地平线（微调版：顶部更柔，地平线的暖带稍微露一点）
        vec3 top = vec3(0.373, 0.639, 0.812);
        vec3 mid = vec3(0.573, 0.765, 0.902);
        vec3 low = vec3(0.937, 0.902, 0.835);

        float t = uTime * 0.004; // 天空自身也极慢地呼吸
        vec3 col = mix(low, mid, smoothstep(0.00, 0.26, vUv.y));
        col = mix(col, top, smoothstep(0.46, 1.0, vUv.y));

        // 高空一层很淡的暖雾，让大片蓝色不死板
        vec2 p = vec2(vUv.x * uAspect, vUv.y) * 2.0;
        float haze = fbm(p + vec2(t, t * 0.35));
        col = mix(col, vec3(1.0, 0.98, 0.94), smoothstep(0.50, 0.98, haze) * 0.10);

        // 右上角一抹暖金日光，不画硬边太阳，保持干净
        vec2 sp = vec2(0.76, 0.82);
        float d = distance(vec2(vUv.x * uAspect, vUv.y), vec2(sp.x * uAspect, sp.y));
        col += vec3(1.0, 0.88, 0.66) * exp(-d * 2.4) * 0.20;

        // 抖动，消除大面积渐变的色带
        col += (hash(vUv * 1024.0) - 0.5) * 0.006;

        gl_FragColor = vec4(col, 1.0);
      }
    `,
  })
);
sky.position.z = -60;
sky.renderOrder = -1;
scene.add(sky);

/* ------------------------------------------------------------- 云 */

const cloudTex = [makeCloudTexture(11), makeCloudTexture(29), makeCloudTexture(47), makeCloudTexture(83)];
const cloudGeo = new THREE.PlaneGeometry(1, 1);

const tanHalfFov = Math.tan(THREE.MathUtils.degToRad(45) / 2);

const clouds = [];
// cross = 这朵云飘过整个可视画面的秒数。六朵必须相同：
// 屏幕速度一致 + 初始均匀分布，云的间距才永远均匀，
// 不会有时挤成一团、有时空缺一大块（之前速度差 7 倍，就是密度忽密忽疏的原因）。
const LAYOUT = [
  { z: -44, h: 16.0, y:  3.0, cross: 64, bob: 0.26, period: 11.0, tex: 0, op: 0.97 },
  { z: -36, h: 12.0, y: -1.4, cross: 64, bob: 0.32, period: 10.0, tex: 1, op: 0.95 },
  { z: -28, h:  8.6, y:  4.5, cross: 64, bob: 0.40, period:  9.5, tex: 2, op: 0.92 },
  { z: -21, h:  5.9, y: -3.4, cross: 64, bob: 0.46, period:  9.0, tex: 3, op: 0.86, below: true },
  { z: -15, h:  3.9, y:  1.2, cross: 64, bob: 0.54, period:  8.5, tex: 0, op: 0.76 },
  { z: -11, h:  2.6, y:  5.2, cross: 64, bob: 0.62, period:  8.0, tex: 1, op: 0.62 },
];

for (const c of LAYOUT) {
  const w = c.h * cloudTex[c.tex].userAspect;
  const mesh = new THREE.Mesh(cloudGeo, new THREE.MeshBasicMaterial({
    map: cloudTex[c.tex],
    transparent: true,
    opacity: c.op,
    depthWrite: false,
  }));
  mesh.scale.set(w, c.h, 1);
  mesh.position.set(0, c.y, c.z);
  scene.add(mesh);
  clouds.push({ mesh, w, halfW: 0, wrap: 0, speed: 0, placed: false,
                phase: Math.random() * Math.PI * 2, ...c });
}

// 云的排布是"传送带"式的：
// 1. 所有云同一个 cross（飘过整屏的秒数），屏幕上的移动速度完全一致；
// 2. 环绕边界统一取可视宽度的固定倍数；
// 3. 初始位置按槽位均匀铺满整屏，不随机。
// 三件事合起来，云的间距永远均匀，密度不会忽密忽疏。
// 若页面上有内容面板（比如合并进游戏页时的卡片），就把云压到面板上缘、
// 只露出上半截，否则云全程被面板挡着，看着就像没在飘。
const PEEK = [0.35, 0.05, 0.5, 0.2, 0.65, 0.3]; // 每朵云露出面板上缘的高度（占自身半高）

function layoutClouds() {
  const panel = document.querySelector('.cards-panel');
  const pr = panel ? panel.getBoundingClientRect() : null;

  clouds.forEach((c, slot) => {
    const dist = camera.position.z - c.z;
    const halfH = dist * tanHalfFov;                    // 该景深下的半屏高（世界单位）
    const visibleHalf = halfH * camera.aspect;
    c.halfW = visibleHalf * 1.4;
    c.wrap = c.halfW * 2;
    c.speed = (visibleHalf * 2) / c.cross;              // 飘过可视宽度正好用 cross 秒

    if (pr) {
      const toWorld = (sy) => (1 - 2 * sy / innerHeight) * halfH;
      const bandTop = toWorld(pr.top), bandBottom = toWorld(pr.bottom);
      const halfCloud = c.h / 2;
      const blocked = (c.y + c.bob + halfCloud > bandBottom) &&
                      (c.y - c.bob - halfCloud < bandTop);
      if (blocked) {
        if (c.below || bandTop + halfCloud * 1.3 >= halfH) {
          c.y = bandBottom - halfCloud * 0.85;          // 沉到面板下面
        } else {
          // 云心压到面板上缘附近，每朵露出的高度各不相同，别排成一条整齐的横排
          c.y = bandTop + halfCloud * PEEK[slot % PEEK.length];
        }
      }
    }

    if (!c.placed) {
      // 初始按槽位均匀铺满整屏，而不是随机落点
      c.mesh.position.x = ((slot + 0.5) / clouds.length * 2 - 1) * visibleHalf;
      c.mesh.position.y = c.y;
      c.placed = true;
    } else {
      c.mesh.position.x = ((c.mesh.position.x + c.halfW) % c.wrap + c.wrap) % c.wrap - c.halfW;
    }
  });
}

/* ---------------------------------------------------- 交互与自适应 */

const pointer = { x: 0, y: 0 };
const smooth  = { x: 0, y: 0 };
addEventListener('pointermove', (e) => {
  pointer.x = (e.clientX / innerWidth - 0.5) * 2;
  pointer.y = (e.clientY / innerHeight - 0.5) * 2;
});

function resize() {
  const aspect = innerWidth / innerHeight;
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  skyUniforms.uAspect.value = aspect;

  // 底板永远盖满视野
  const h = 2 * tanHalfFov * Math.abs(camera.position.z - sky.position.z);
  sky.scale.set(h * aspect * 1.2, h * 1.2, 1);
  layoutClouds();
}
addEventListener('resize', resize);
resize();

/* -------------------------------------------------------- 主循环 */

const clock = new THREE.Clock();
let elapsed = 0;

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  for (const c of clouds) {
    c.mesh.position.x += c.speed * dt;
    if (c.mesh.position.x > c.halfW) c.mesh.position.x -= c.wrap;
    // 上下轻轻浮，周期各自错开，不做成"上下跳"
    c.mesh.position.y = c.y + Math.sin(elapsed * (Math.PI * 2 / c.period) + c.phase) * c.bob;
  }

  // 相机极慢地摆动 + 一点点跟随鼠标，量很小，只求"活"
  const swayX = Math.sin(elapsed * 0.06) * 0.5 + pointer.x * 0.5;
  const swayY = Math.cos(elapsed * 0.047) * 0.28 - pointer.y * 0.35;
  smooth.x += (swayX - smooth.x) * 0.02;
  smooth.y += (swayY - smooth.y) * 0.02;
  camera.position.x = smooth.x;
  camera.position.y = smooth.y;
  camera.lookAt(0, 0, -20);

  skyUniforms.uTime.value = elapsed;
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(tick);

// 切到后台时停掉渲染，回来继续
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    renderer.setAnimationLoop(null);
  } else {
    clock.getDelta();
    renderer.setAnimationLoop(tick);
  }
});
</script>
</body>
</html>
